name: Actualizar Datos de Renfe

on:
  schedule:
    - cron: '0 */2 * * *' # Cada 2 horas para mantener la telemetría local de respaldo actualizada
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Descargar telemetría actualizada
        run: |
          python -c '
          import urllib.request, os, json

          headers = {"User-Agent": "Mozilla/5.0"}
          urls = [
              ("https://tiempo-real.largorecorrido.renfe.com/renfe-visor/flotaLD.json", "data/flotaLD.json"),
              ("https://tiempo-real.largorecorrido.renfe.com/renfe-visor/trenesConEstacionesLD.json", "data/trenesConEstacionesLD.json")
          ]

          os.makedirs("data", exist_ok=True)
          for u, dest in urls:
              try:
                  req = urllib.request.Request(u, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      content = resp.read()
                  # Only replace the backup with real Renfe data: an error page would break the offline fallback.
                  data = json.loads(content)
                  if not isinstance(data, dict) or not isinstance(data.get("trenes"), list) or not data["trenes"]:
                      raise ValueError("respuesta sin lista de trenes")
                  if len(content) > 5_000_000:
                      raise ValueError("respuesta demasiado grande")
                  with open(dest, "wb") as f:
                      f.write(content)
                  print(f"Descargado con éxito: {dest} ({len(content)} bytes, {len(data['trenes'])} trenes)")
              except Exception as e:
                  print(f"Se conserva la copia anterior de {dest}: {e}")
          '

      - name: Generar horarios programados de las próximas horas
        run: python scripts/build_programados.py data/programados.json

      - name: Guardar cambios si hay diferencias
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync telemetría Renfe" && git push)
